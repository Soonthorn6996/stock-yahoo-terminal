<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Yahoo Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Boot screen ── */
#boot-screen{min-height:100vh;background:#050608;display:flex;align-items:center;justify-content:center;font-family:'Manrope',system-ui,sans-serif}
.boot-inner{display:flex;flex-direction:column;align-items:center;gap:16px}
.boot-mark{width:40px;height:40px;border-radius:10px;background:oklch(0.85 0.16 158);position:relative;animation:bpulse 1.8s infinite}
.boot-mark::before{content:"";position:absolute;left:8px;bottom:8px;width:5px;height:14px;border-radius:2px;background:#050608}
.boot-mark::after{content:"";position:absolute;left:17px;bottom:8px;width:5px;height:20px;border-radius:2px;background:#050608}
.boot-mark .third{position:absolute;left:26px;bottom:8px;width:5px;height:10px;border-radius:2px;background:#050608}
.boot-name{color:#f3f5f8;font-size:18px;font-weight:700;letter-spacing:.08em}
.boot-sub{color:#4a505b;font-size:13px}
@keyframes bpulse{0%,100%{opacity:1}50%{opacity:.55}}

/* ── Design system tokens ── */
:root{
  --bg-0:#050608;--bg-1:#0a0c10;--bg-2:#11141a;--bg-3:#181c24;--bg-4:#232833;
  --line-1:rgba(255,255,255,.04);--line-2:rgba(255,255,255,.08);--line-3:rgba(255,255,255,.14);
  --fg-0:#f3f5f8;--fg-1:#c8cdd5;--fg-2:#7d8591;--fg-3:#4a505b;--fg-4:#2d323a;
  --accent:oklch(0.85 0.16 158);--accent-soft:oklch(0.85 0.16 158/.16);--accent-line:oklch(0.85 0.16 158/.40);
  --up:oklch(0.80 0.17 152);--up-2:oklch(0.80 0.17 152/.14);
  --down:oklch(0.70 0.22 25);--down-2:oklch(0.70 0.22 25/.14);
  --radius-sm:6px;--radius:10px;--radius-lg:16px;--radius-xl:22px;
  --shadow-1:0 1px 0 rgba(255,255,255,.04) inset,0 12px 30px -18px rgba(0,0,0,.7);
  --shadow-2:0 1px 0 rgba(255,255,255,.05) inset,0 24px 50px -24px rgba(0,0,0,.85);
  --font-sans:"Manrope",-apple-system,"Segoe UI",system-ui,sans-serif;
  --font-mono:"JetBrains Mono","SF Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg-0);color:var(--fg-0);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(1100px 600px at 75% -10%,oklch(0.85 0.16 158/.06),transparent 60%),radial-gradient(900px 500px at -10% 110%,oklch(0.50 0.18 280/.05),transparent 60%);z-index:0}
#root{position:relative;z-index:1}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit;background:none;border:0;outline:none}
a{color:inherit;text-decoration:none;cursor:pointer}
svg{flex-shrink:0}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.dim{color:var(--fg-2)}
.up{color:var(--up)}.down{color:var(--down)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;font-size:12px;border-radius:999px;background:var(--bg-3);color:var(--fg-1);border:1px solid var(--line-2)}
.chip.up{background:var(--up-2);color:var(--up);border-color:transparent}
.chip.down{background:var(--down-2);color:var(--down);border-color:transparent}
.chip .dot{width:6px;height:6px;border-radius:999px;background:currentColor}

/* ── App shell ── */
.shell{display:grid;grid-template-columns:240px 1fr;grid-template-rows:56px 1fr;grid-template-areas:"side top" "side main";min-height:100vh}
.shell-top{grid-area:top}.shell-side{grid-area:side}
.shell-main{grid-area:main;padding:24px 32px 80px;overflow-x:hidden}

/* ── Top bar ── */
.topbar{display:flex;align-items:center;gap:16px;padding:0 24px 0 28px;border-bottom:1px solid var(--line-1);background:linear-gradient(to bottom,var(--bg-1),var(--bg-0));position:sticky;top:0;z-index:30}
.topbar .search{flex:1;max-width:520px;height:36px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--bg-2);border:1px solid var(--line-2);border-radius:10px;color:var(--fg-2);cursor:text;transition:border-color .15s}
.topbar .search:hover{border-color:var(--line-3)}
.topbar .search kbd{font-family:var(--font-mono);font-size:11px;padding:2px 6px;background:var(--bg-3);border:1px solid var(--line-2);border-radius:5px;color:var(--fg-2)}
.topbar .clock{font-family:var(--font-mono);font-size:12px;color:var(--fg-2);display:flex;align-items:center;gap:8px}
.topbar .clock .live-dot{width:7px;height:7px;border-radius:999px;background:var(--up);box-shadow:0 0 0 4px var(--up-2);animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.topbar .avatar{width:32px;height:32px;border-radius:999px;background:linear-gradient(135deg,var(--accent),oklch(0.55 0.18 280));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:var(--bg-0)}
.api-badge{font-size:10px;padding:3px 8px;border-radius:999px;font-weight:600;letter-spacing:.04em}
.api-badge.live{background:var(--up-2);color:var(--up);border:1px solid transparent}
.api-badge.mock{background:var(--bg-3);color:var(--fg-3);border:1px solid var(--line-2)}

/* ── Sidebar ── */
.sidebar{border-right:1px solid var(--line-1);background:var(--bg-1);padding:18px 14px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 22px}
.brand-mark{width:26px;height:26px;border-radius:7px;background:var(--accent);position:relative}
.brand-mark::before{content:"";position:absolute;left:5px;bottom:5px;width:3px;height:9px;border-radius:1px;background:var(--bg-0)}
.brand-mark::after{content:"";position:absolute;left:11px;bottom:5px;width:3px;height:14px;border-radius:1px;background:var(--bg-0)}
.brand-mark .third{position:absolute;left:17px;bottom:5px;width:3px;height:6px;border-radius:1px;background:var(--bg-0)}
.brand-name{font-weight:700;font-size:14px;letter-spacing:.04em}
.brand-name span{color:var(--fg-2);font-weight:400}
.nav-section{margin-top:14px;padding:0 8px 6px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3)}
.nav-item{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:8px;color:var(--fg-1);font-size:13.5px;font-weight:500;position:relative;transition:background .12s,color .12s}
.nav-item:hover{background:var(--bg-2);color:var(--fg-0)}
.nav-item.active{background:var(--bg-2);color:var(--fg-0)}
.nav-item.active::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:2px;background:var(--accent);border-radius:0 2px 2px 0}
.nav-item svg{width:16px;height:16px;opacity:.85}
.nav-mini{margin-top:auto;padding:12px;border-radius:var(--radius);border:1px solid var(--line-2);background:var(--bg-2);font-size:12px;color:var(--fg-2);line-height:1.5}
.nav-mini b{color:var(--fg-0);font-weight:600}

/* ── Card ── */
.card{background:var(--bg-2);border:1px solid var(--line-1);border-radius:var(--radius-lg);padding:20px;position:relative}
.card.tight{padding:16px}
.card h3{margin:0 0 14px;font-size:13px;letter-spacing:.04em;color:var(--fg-2);font-weight:600;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between}

/* ── Market ribbon ── */
.ribbon{display:flex;gap:0;border:1px solid var(--line-1);background:var(--bg-1);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:18px}
.ribbon-item{flex:1;padding:14px 16px;border-right:1px solid var(--line-1);display:flex;flex-direction:column;gap:4px;min-width:0}
.ribbon-item:last-child{border-right:0}
.ribbon-name{font-size:11px;color:var(--fg-2);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ribbon-price{font-family:var(--font-mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.ribbon-change{font-size:11px;font-family:var(--font-mono)}

/* ── Watchlist table ── */
.watchlist{width:100%;border-collapse:collapse}
.watchlist th,.watchlist td{padding:12px 14px;text-align:right;font-size:13.5px;border-bottom:1px solid var(--line-1);white-space:nowrap}
.watchlist th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-2);font-weight:500;padding-top:4px;padding-bottom:8px}
.watchlist th:first-child,.watchlist td:first-child{text-align:left}
.watchlist tbody tr{cursor:pointer;transition:background .1s}
.watchlist tbody tr:hover{background:var(--bg-3)}
.watchlist .sym{display:flex;align-items:center;gap:12px}
.logo{border-radius:8px;background:var(--bg-3);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:600;border:1px solid var(--line-2);flex-shrink:0}
.watchlist .sym-text{display:flex;flex-direction:column;gap:1px;min-width:0}
.watchlist .sym-ticker{font-weight:600;font-size:14px}
.watchlist .sym-name{font-size:11.5px;color:var(--fg-2);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spark-cell{width:120px}
.spark{display:block}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:8px;font-size:13px;font-weight:600;background:var(--bg-3);border:1px solid var(--line-2);color:var(--fg-0);transition:all .12s}
.btn:hover{background:var(--bg-4);border-color:var(--line-3)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--bg-0)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.icon{padding:8px}
.btn svg{width:14px;height:14px}

/* ── Detail screen ── */
.detail-header{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:20px}
.detail-title{display:flex;align-items:center;gap:16px}
.detail-title .logo{width:48px;height:48px;font-size:14px}
.detail-title h1{margin:0;font-size:18px;font-weight:600;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.detail-title h1 .ticker{font-family:var(--font-mono);font-weight:700;font-size:22px}
.detail-title h1 .ex{font-size:10px;padding:3px 7px;background:var(--bg-3);border-radius:4px;color:var(--fg-2);letter-spacing:.08em;font-weight:500}
.detail-title .name{font-size:13px;color:var(--fg-2);margin-top:2px}
.price-block{display:flex;align-items:baseline;gap:16px}
.price-block .big{font-family:var(--font-mono);font-size:44px;font-weight:600;letter-spacing:-.02em;line-height:1}
.price-block .delta{font-family:var(--font-mono);font-size:16px;font-weight:500}
.range{height:6px;border-radius:999px;background:var(--bg-3);position:relative;margin:10px 0 6px}
.range .fill{position:absolute;height:100%;border-radius:999px;background:linear-gradient(to right,var(--down),var(--accent));opacity:.4;left:0;right:0}
.range .marker{position:absolute;top:-3px;width:12px;height:12px;border-radius:999px;background:var(--fg-0);border:2px solid var(--bg-1);transform:translateX(-50%)}
.range-labels{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:11px;color:var(--fg-2)}
.period-tabs{display:inline-flex;padding:3px;background:var(--bg-1);border:1px solid var(--line-2);border-radius:8px;gap:2px}
.period-tabs button{padding:6px 12px;font-size:12px;font-weight:500;border-radius:6px;color:var(--fg-2);font-family:var(--font-mono);letter-spacing:.04em}
.period-tabs button.active{background:var(--bg-3);color:var(--fg-0);box-shadow:0 1px 0 var(--line-2) inset}
.period-tabs button:hover:not(.active){color:var(--fg-0)}
.chart-wrap{position:relative;height:360px;margin-top:8px}
.chart-wrap svg{display:block;width:100%;height:100%}
.crosshair-label{position:absolute;pointer-events:none;background:var(--bg-3);border:1px solid var(--line-2);padding:8px 12px;border-radius:8px;font-family:var(--font-mono);font-size:11px;line-height:1.5;color:var(--fg-0);box-shadow:var(--shadow-1);white-space:nowrap;z-index:5}
.crosshair-label .date{color:var(--fg-2);font-size:10px;margin-bottom:4px}
.crosshair-label .price{font-weight:600;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line-1);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line-1)}
.stat{background:var(--bg-2);padding:14px 16px}
.stat-label{font-size:11px;color:var(--fg-2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.stat-value{font-family:var(--font-mono);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.ai-card{background:linear-gradient(180deg,var(--accent-soft),transparent 70%),var(--bg-2);border:1px solid var(--accent-line);border-radius:var(--radius-lg);padding:20px;position:relative}
.ai-card h3{margin:0 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--accent);display:flex;align-items:center;gap:8px}
.ai-card p{margin:0;font-size:14px;line-height:1.65;color:var(--fg-1)}
.ai-card .ai-mark{width:14px;height:14px;border-radius:3px;background:var(--accent);position:relative}
.ai-card .ai-mark::after{content:"";position:absolute;inset:3px;background:var(--bg-0);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}

/* ── Search overlay ── */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(8px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding-top:90px;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.search-modal{width:560px;max-width:calc(100vw - 32px);background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--radius-lg);box-shadow:var(--shadow-2);overflow:hidden}
.search-input{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line-1)}
.search-input input{flex:1;font-size:16px;color:var(--fg-0)}
.search-results{max-height:360px;overflow-y:auto;padding:6px}
.search-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;cursor:pointer}
.search-row:hover,.search-row.focused{background:var(--bg-3)}
.search-row .info{flex:1;min-width:0}
.search-row .info .t{font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center}
.search-row .info .t span{font-size:10px;color:var(--fg-2);padding:1px 5px;background:var(--bg-1);border-radius:3px}
.search-row .info .n{font-size:11.5px;color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-row .px{font-family:var(--font-mono);font-size:13px;text-align:right}
.search-footer{border-top:1px solid var(--line-1);padding:10px 16px;display:flex;gap:14px;font-size:11px;color:var(--fg-2)}
.search-footer kbd{font-family:var(--font-mono);background:var(--bg-1);padding:1px 5px;border-radius:3px;border:1px solid var(--line-2);font-size:10.5px;margin-right:4px}

/* ── Login ── */
.login-shell{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.login-pane{display:flex;flex-direction:column;justify-content:space-between;padding:40px 56px}
.login-art{background:var(--bg-1);border-left:1px solid var(--line-1);position:relative;overflow:hidden}
.login-card{max-width:380px;width:100%;margin:auto;padding:0}
.login-card h1{margin:0 0 8px;font-size:28px;font-weight:700;letter-spacing:-.01em}
.login-card .sub{color:var(--fg-2);font-size:14px;margin-bottom:28px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-2);margin-bottom:6px;font-weight:600}
.field input[type=email],.field input[type=password],.field input[type=text]{width:100%;padding:11px 14px;background:var(--bg-2);border:1px solid var(--line-2);border-radius:8px;color:var(--fg-0);font-size:14px;transition:border-color .12s}
.field input:focus{border-color:var(--accent)}
.field.row{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.field.row a{color:var(--accent)}
.divider{display:flex;align-items:center;gap:12px;font-size:11px;color:var(--fg-3);text-transform:uppercase;letter-spacing:.08em;margin:18px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line-2)}
.oauth-row{display:flex;gap:10px}
.oauth-row .btn{flex:1;justify-content:center}
.foot{font-size:12px;color:var(--fg-3);display:flex;justify-content:space-between}
.art-grid{position:absolute;inset:0;background-image:linear-gradient(var(--line-1) 1px,transparent 1px),linear-gradient(90deg,var(--line-1) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(circle at 50% 40%,#000 35%,transparent 75%)}
.art-content{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px;text-align:center}
.art-content h2{font-size:36px;font-weight:700;letter-spacing:-.01em;margin:0 0 12px;max-width:380px;line-height:1.15}
.art-content p{color:var(--fg-2);margin:0 0 28px;max-width:380px;line-height:1.6;font-size:14px}
.art-ticker-stack{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:420px}
.art-tile{border:1px solid var(--line-2);background:var(--bg-2);border-radius:12px;padding:12px 14px}
.art-tile .row1{display:flex;justify-content:space-between;font-size:11px;color:var(--fg-2);margin-bottom:4px}
.art-tile .row1 b{color:var(--fg-0);font-family:var(--font-mono);font-weight:600}
.art-tile .row2{font-family:var(--font-mono);font-size:16px;font-weight:600}

/* ── Error/info toast ── */
.toast{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;align-items:center;gap:10px;padding:12px 18px;background:var(--bg-3);border:1px solid var(--line-2);border-radius:10px;font-size:13px;box-shadow:var(--shadow-2);animation:fadeIn .2s ease}
.toast.error{border-color:var(--down-2);color:var(--down)}
.toast.success{border-color:var(--up-2);color:var(--up)}

/* ── Setup panel ── */
.setup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(12px);z-index:150;display:flex;align-items:center;justify-content:center}
.setup-card{width:520px;max-width:calc(100vw - 32px);background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--radius-xl);padding:32px;box-shadow:var(--shadow-2)}
.setup-card h2{margin:0 0 6px;font-size:20px;font-weight:700}
.setup-card .sub{color:var(--fg-2);font-size:13px;margin-bottom:24px}
.setup-card pre{background:var(--bg-1);border:1px solid var(--line-2);border-radius:8px;padding:14px;font-family:var(--font-mono);font-size:11px;color:var(--fg-1);overflow-x:auto;line-height:1.6;margin:8px 0 16px}
.tab-row{display:flex;gap:4px;margin-bottom:20px}
.tab-row button{padding:7px 14px;font-size:12px;font-weight:600;border-radius:6px;color:var(--fg-2);background:transparent;border:1px solid transparent}
.tab-row button.active{background:var(--bg-3);color:var(--fg-0);border-color:var(--line-2)}

/* ── Responsive ── */
@media(max-width:1200px){.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:980px){.shell{grid-template-columns:1fr;grid-template-areas:"top" "main"}.shell-side{display:none}.login-shell{grid-template-columns:1fr}.login-art{display:none}}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg-3);border-radius:8px;border:2px solid var(--bg-0)}
::-webkit-scrollbar-thumb:hover{background:var(--bg-4)}
</style>
</head>
<body>

<div id="root">
  <div id="boot-screen">
    <div class="boot-inner">
      <div class="boot-mark"><div class="third"></div></div>
      <div class="boot-name">STOCK YAHOO / TERMINAL</div>
      <div class="boot-sub">Loading...</div>
    </div>
  </div>
</div>

<!-- CDN scripts -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

function getSupabase() {

const Auth = {
  async signIn(email, password) {
    const sb = getSupabase();
    if (sb) {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw new Error(error.message);
      return { ...data.user, name: data.user.email.split('@')[0], source: 'supabase' };
    }
    // Fallback: mock auth
    const u = MOCK_USERS.find(m => m.email === email && m.password === password);
    if (!u) throw new Error('Invalid email or password');
    return { email: u.email, name: u.name, role: u.role, source: 'mock' };
  },

  async signOut() {
    const sb = getSupabase();
    if (sb) await sb.auth.signOut();
  },

  async getSession() {
    const sb = getSupabase();
    if (sb) {
      const { data } = await sb.auth.getSession();
      if (data?.session?.user) return { ...data.session.user, name: data.session.user.email.split('@')[0], source: 'supabase' };
    }
    return null;
  }
};

// ═══════════════════════════════════════════════════════════
//  YAHOO FINANCE API LAYER
// ═══════════════════════════════════════════════════════════
const YF = {
  _cache: {},
  _cacheTs: {},

  async fetch(url) {
    const proxied = CONFIG.YF_PROXY + encodeURIComponent(url);
    const r = await fetch(proxied, { headers: { 'x-requested-with': 'XMLHttpRequest' } });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  },

  // Fetch multiple quotes at once
  async getQuotes(symbols) {
    const key = 'quotes:' + symbols.join(',');
    if (this._cache[key] && Date.now() - this._cacheTs[key] < 30_000) return this._cache[key];
    const url = `https://query2.finance.yahoo.com/v7/finance/quote?symbols=${symbols.join(',')}&lang=en-US&region=US&fields=symbol,longName,regularMarketPrice,regularMarketChange,regularMarketChangePercent,regularMarketVolume,marketCap,trailingPE,fiftyTwoWeekHigh,fiftyTwoWeekLow,fullExchangeName,currency,sector`;
    const data = await this.fetch(url);
    const results = data?.quoteResponse?.result || [];
    this._cache[key] = results;
    this._cacheTs[key] = Date.now();
    return results;
  },

  // Fetch chart (historical prices)
  async getChart(symbol, range = '1mo', interval = '1d') {
    const key = `chart:${symbol}:${range}`;
    if (this._cache[key] && Date.now() - this._cacheTs[key] < 60_000) return this._cache[key];
    const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?interval=${interval}&range=${range}`;
    const data = await this.fetch(url);
    const result = data?.chart?.result?.[0];
    if (!result) throw new Error('No chart data');
    const closes = result.indicators?.quote?.[0]?.close || [];
    const filtered = closes.filter(v => v !== null && v !== undefined);
    this._cache[key] = filtered;
    this._cacheTs[key] = Date.now();
    return filtered;
  },

  // Map Yahoo quote object → internal stock format
  mapQuote(q, fallback = {}) {
    return {
      symbol:          q.symbol              || fallback.symbol,
      name:            q.longName            || q.shortName || fallback.name,
      exchange:        q.fullExchangeName    || fallback.exchange || 'N/A',
      currency:        q.currency            || fallback.currency || 'USD',
      price:           q.regularMarketPrice  ?? fallback.price,
      change:          q.regularMarketChange ?? fallback.change,
      change_percent:  q.regularMarketChangePercent ?? fallback.change_percent,
      volume:          q.regularMarketVolume ?? fallback.volume,
      market_cap:      q.marketCap           ?? fallback.market_cap,
      pe_ratio:        q.trailingPE          ?? fallback.pe_ratio ?? 0,
      week_52_high:    q.fiftyTwoWeekHigh    ?? fallback.week_52_high,
      week_52_low:     q.fiftyTwoWeekLow     ?? fallback.week_52_low,
      sector:          q.sector              || fallback.sector || '',
      _live: true,
    };
  }
};

function fmtPct(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function fmtBig(n) {
  if (!n && n !== 0) return '—';
  if (n >= 1e12) return (n / 1e12).toFixed(2) + 'T';
  if (n >= 1e9)  return (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e6)  return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3)  return (n / 1e3).toFixed(1) + 'K';
  return n.toLocaleString();
}
function fmtPrice(price, currency) {
  if (price === undefined || price === null) return '—';
  const sym = currency === 'THB' ? '฿' : '$';
  return sym + price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// Seeded pseudo-random sparkline data
function buildSpark(stock, n = 32) {
  const seed = stock.sparkSeed ?? 1;
  let x = seed * 1000 + 12345;
  const rnd = () => { x = (x * 9301 + 49297) % 233280; return x / 233280; };
  let v = stock.price * (1 - (stock.trend === 'down' ? -0.06 : 0.02));
  const arr = [];
  for (let i = 0; i < n; i++) {
    v *= 1 + (rnd() - (stock.trend === 'down' ? 0.52 : 0.48)) * 0.025;
    arr.push(v);
  }
  arr[n - 1] = stock.price;
  return arr;
}

function buildSeries(stock, n = 60, vol = 0.15) {
  const seed = (stock.sparkSeed ?? 1) * 7 + 99;
  let x = seed * 777;
  const rnd = () => { x = (x * 9301 + 49297) % 233280; return x / 233280; };
  const arr = [];
  let v = stock.price * (1 - (stock.change_percent / 100) * (n / 30));
  for (let i = 0; i < n; i++) {
    v *= 1 + (rnd() - 0.48) * (vol / Math.sqrt(n));
    arr.push(v);
  }
  arr[n - 1] = stock.price;
  return arr;
}

function Sparkline({ data, color, width=110, height=32 }) {
  if (!data || data.length < 2) return null;
  const min = Math.min(...data), max = Math.max(...data), range = max - min || 1;
  const pad = 1, step = (width - pad*2) / (data.length - 1);
  const pts = data.map((v,i) => [pad + i*step, pad + (height-pad*2)*(1-(v-min)/range)]);
  const d = pts.map((p,i) => (i===0?`M${p[0]},${p[1]}`:`L${p[0]},${p[1]}`)).join(' ');
  return (
    <svg className="spark" width={width} height={height} viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none">
      <path d={d} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

function LineChart({ series, trend, height=360 }) {
  const wrapRef = React.useRef(null);
  const [hover, setHover] = React.useState(null);
  const [w, setW] = React.useState(800);
  React.useEffect(() => {
    if (!wrapRef.current) return;
    const ro = new ResizeObserver(entries => { for (const e of entries) setW(e.contentRect.width); });
    ro.observe(wrapRef.current);
    return () => ro.disconnect();
  }, []);
  if (!series || series.length < 2) return <div className="chart-wrap" ref={wrapRef} style={{display:'flex',alignItems:'center',justifyContent:'center',color:'var(--fg-3)',fontSize:13}}>Loading chart data...</div>;
  const padL=8,padR=56,padT=14,padB=26,W=Math.max(300,w),H=height;
  const min=Math.min(...series),max=Math.max(...series),range=max-min||1;
  const step=(W-padL-padR)/(series.length-1);
  const xy=series.map((v,i)=>[padL+i*step, padT+(H-padT-padB)*(1-(v-min)/range)]);
  const d=xy.map((p,i)=>(i===0?`M${p[0]},${p[1]}`:`L${p[0]},${p[1]}`)).join(' ');
  const dFill=d+` L${xy[xy.length-1][0]},${H-padB} L${xy[0][0]},${H-padB} Z`;
  const color=trend==='down'?'var(--down)':'var(--accent)';
  const gradId='g_'+trend;
  const ticks=4, yLines=[];
  for (let i=0;i<=ticks;i++) { const v=min+(range*i/ticks); yLines.push({y:padT+(H-padT-padB)*(1-(v-min)/range),v}); }
  const days=series.length, today=new Date();
  const labelIdx=[0,Math.floor(days/4),Math.floor(days/2),Math.floor(3*days/4),days-1];
  const xLabels=labelIdx.map(i=>{const dt=new Date(today);dt.setDate(dt.getDate()-(days-1-i));return{x:xy[i][0],label:dt.toLocaleDateString('en-US',{month:'short',day:'numeric'})};});
  const onMove=(e)=>{
    const rect=wrapRef.current.getBoundingClientRect();
    const mx=e.clientX-rect.left;
    if (mx<padL||mx>W-padR){setHover(null);return;}
    const idx=Math.max(0,Math.min(series.length-1,Math.round((mx-padL)/step)));
    setHover({idx,x:xy[idx][0],y:xy[idx][1]});
  };
  return (
    <div className="chart-wrap" ref={wrapRef} onMouseMove={onMove} onMouseLeave={()=>setHover(null)}>
      <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none">
        <defs>
          <linearGradient id={gradId} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={color} stopOpacity="0.28"/>
            <stop offset="100%" stopColor={color} stopOpacity="0"/>
          </linearGradient>
        </defs>
        {yLines.map((l,i)=>(
          <g key={i}>
            <line x1={padL} x2={W-padR} y1={l.y} y2={l.y} stroke="rgba(255,255,255,.04)" strokeDasharray="2 4"/>
            <text x={W-padR+8} y={l.y+3} fontSize="10" fill="var(--fg-3)" fontFamily="var(--font-mono)">{l.v>=1000?l.v.toFixed(0):l.v.toFixed(2)}</text>
          </g>
        ))}
        {xLabels.map((l,i)=>(
          <text key={i} x={l.x} y={H-4} fontSize="10" fill="var(--fg-3)" fontFamily="var(--font-mono)" textAnchor="middle">{l.label}</text>
        ))}
        <path d={dFill} fill={`url(#${gradId})`}/>
        <path d={d} fill="none" stroke={color} strokeWidth="1.7" strokeLinejoin="round"/>
        {hover&&<>
          <line x1={hover.x} x2={hover.x} y1={padT} y2={H-padB} stroke="rgba(255,255,255,.12)" strokeDasharray="3 3"/>
          <circle cx={hover.x} cy={hover.y} r="4" fill={color} stroke="var(--bg-0)" strokeWidth="2"/>
        </>}
      </svg>
      {hover&&(
        <div className="crosshair-label" style={{
          left: hover.x+padL > W*0.7 ? hover.x-130 : hover.x+16,
          top: Math.max(10, hover.y-20),
        }}>
          <div className="date">{(()=>{const dt=new Date(today);dt.setDate(dt.getDate()-(series.length-1-hover.idx));return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});})()}</div>
          <div className="price">{fmtPrice(series[hover.idx],'USD')}</div>
        </div>
      )}
    </div>
  );
}

}

        <MoversCard title="Top Losers"  items={losers}  direction="down" onOpen={onOpen}/>
      </div>
    </div>
  );
}

}

function PortfolioChart() {
  const data = React.useMemo(()=>{
    let x=42*9301+49297;const rnd=()=>{x=(x*9301+49297)%233280;return x/233280;};
    let v=230000;const arr=[];
    for(let i=0;i<90;i++){v*=1+(rnd()-.45)*.012;arr.push(v);}
    arr[89]=248392;return arr;
  },[]);
  const min=Math.min(...data),max=Math.max(...data),range=max-min||1;
  const pad=4,W=1000,H=120,step=(W-pad*2)/(data.length-1);
  const pts=data.map((v,i)=>[pad+i*step,pad+(H-pad*2)*(1-(v-min)/range)]);
  const d=pts.map((p,i)=>(i===0?`M${p[0]},${p[1]}`:`L${p[0]},${p[1]}`)).join(' ');
  const dFill=d+` L${pts[pts.length-1][0]},${H} L${pts[0][0]},${H} Z`;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" style={{width:'100%',height:'100%'}}>
      <defs><linearGradient id="port" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stopColor="var(--accent)" stopOpacity="0.30"/>
        <stop offset="100%" stopColor="var(--accent)" stopOpacity="0"/>
      </linearGradient></defs>
      <path d={dFill} fill="url(#port)"/>
      <path d={d} fill="none" stroke="var(--accent)" strokeWidth="1.7" strokeLinejoin="round"/>
    </svg>
  );
}

// ═══════════════════════════════════════════════════════════
//  STOCK DETAIL
// ═══════════════════════════════════════════════════════════
function StockDetail({ symbol, stockDB, onBack, isStarred, onToggleStar }) {
  const base = stockDB[symbol] || MOCK_DB[symbol];
  const [period, setPeriod] = React.useState('1mo');
  const [chartSeries, setChartSeries] = React.useState(null);
  const [loadingChart, setLoadingChart] = React.useState(false);

  const periodToRange = { '1d':'1d','5d':'5d','1mo':'1mo','3mo':'3mo','6mo':'6mo','1y':'1y','5y':'5y' };
  const periodToInterval = { '1d':'5m','5d':'15m','1mo':'1d','3mo':'1d','6mo':'1wk','1y':'1wk','5y':'1mo' };
  const periodToPoints = { '1d':24,'5d':30,'1mo':30,'3mo':65,'6mo':130,'1y':250,'5y':260 };

  React.useEffect(()=>{
    setLoadingChart(true);
    YF.getChart(symbol, periodToRange[period], periodToInterval[period])
      .then(data=>{ if(data&&data.length>1) setChartSeries(data); else throw new Error('empty'); })
      .catch(()=>{ setChartSeries(base ? buildSeries(base, periodToPoints[period]||30, 0.20) : null); })
      .finally(()=>setLoadingChart(false));
  }, [symbol, period]);

  if (!base) return <div className="card">Symbol not found.</div>;
  const s=base;
  const cls=s.change>=0?'up':'down';
  const series=chartSeries||(s?buildSeries(s,periodToPoints[period]||30,0.20):[]);
  const pctOfRange=((s.price-s.week_52_low)/(s.week_52_high-s.week_52_low))*100;

  return (
    <div>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:18,fontSize:13,color:'var(--fg-2)'}}>
        <button className="btn ghost" style={{padding:'6px 10px'}} onClick={onBack}><Icon.ArrowLeft/> Back</button>
        <span style={{color:'var(--fg-3)'}}>·</span><span>Watchlist</span><Icon.Chevron dir="right"/>
        <span style={{color:'var(--fg-0)'}}>{symbol}</span>
        {s._live&&<span className="api-badge live" style={{marginLeft:4}}>LIVE</span>}
      </div>

      <div className="detail-header">
        <div className="detail-title">
          <StockLogo symbol={symbol} size={48}/>
          <div>
            <h1>
              <span className="ticker">{symbol}</span>
              <span className="ex">{s.exchange}</span>
              <span className="ex">{s.currency}</span>
            </h1>
            <div className="name">{s.name} · {s.sector}</div>
          </div>
        </div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn" onClick={onToggleStar}><Icon.Star filled={isStarred}/>{isStarred?'In Watchlist':'Add to Watchlist'}</button>
          <button className="btn"><Icon.Bell/> Set alert</button>
          <button className="btn primary">Trade</button>
        </div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1.7fr 1fr',gap:18,marginBottom:18}}>
        <div className="card">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:18}}>
            <div>
              <div className="price-block">
                <span className="big">{fmtPrice(s.price,s.currency)}</span>
                <span className={'delta '+cls}>{s.change>=0?'▲':'▼'} {Math.abs(s.change).toFixed(2)} ({fmtPct(s.change_percent)})</span>
              </div>
              <div className="dim" style={{fontSize:12,marginTop:6}}>
                {new Date().toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short'})} · Source: Yahoo Finance
              </div>
            </div>
            <div className="period-tabs">
              {['1d','5d','1mo','3mo','6mo','1y','5y'].map(p=>(
                <button key={p} className={p===period?'active':''} onClick={()=>setPeriod(p)}>{p.toUpperCase()}</button>
              ))}
            </div>
          </div>
          {loadingChart
            ? <div style={{height:360,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--fg-3)',fontSize:13}}>Loading chart…</div>
            : <LineChart series={series} trend={s.change>=0?'up':'down'}/>
          }
        </div>

        <div style={{display:'flex',flexDirection:'column',gap:18}}>
          <div className="ai-card">
            <h3><span className="ai-mark"/> AI SUMMARY · CLAUDE</h3>
            <p>{aiSummaryFor(symbol)}</p>
            <button className="btn" style={{marginTop:14,padding:'7px 12px',fontSize:12}}><Icon.Sparkles/> Regenerate</button>
          </div>
          <div className="card">
            <h3>52-Week Range</h3>
            <div className="range"><div className="fill"/><div className="marker" style={{left:`${Math.max(0,Math.min(100,pctOfRange))}%`}}/></div>
            <div className="range-labels">
              <span>{fmtPrice(s.week_52_low,s.currency)}</span>
              <span style={{color:'var(--fg-0)'}}>Now</span>
              <span>{fmtPrice(s.week_52_high,s.currency)}</span>
            </div>
          </div>
        </div>
      </div>

      <div className="stats">
        {[
          ['Open',       fmtPrice(s.price-s.change,s.currency)],
          ['Volume',     fmtBig(s.volume)],
          ['Market Cap', fmtBig(s.market_cap)],
          ['P/E Ratio',  s.pe_ratio?s.pe_ratio.toFixed(2):'—'],
          ['52W High',   fmtPrice(s.week_52_high,s.currency)],
          ['52W Low',    fmtPrice(s.week_52_low,s.currency)],
          ['Exchange',   s.exchange,false],
          ['Sector',     s.sector||'—',false],
        ].map(([label,val,mono=true])=>(
          <div className="stat" key={label}>
            <div className="stat-label">{label}</div>
            <div className="stat-value" style={{fontFamily:mono?'var(--font-mono)':'var(--font-sans)',fontSize:mono?undefined:14}}>{val}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
//  SEARCH OVERLAY
// ═══════════════════════════════════════════════════════════
function SearchOverlay({ onClose, onPick, stockDB }) {
  const [q, setQ] = React.useState('');
  const [focus, setFocus] = React.useState(0);
  const inputRef = React.useRef(null);
  React.useEffect(()=>{ inputRef.current?.focus(); },[]);
  const all = Object.values({...MOCK_DB,...stockDB});
  const results = q.trim() ? all.filter(s=>s.symbol.toLowerCase().includes(q.toLowerCase())||s.name.toLowerCase().includes(q.toLowerCase())) : all.slice(0,8);
  React.useEffect(()=>{
    const onKey=(e)=>{
      if(e.key==='Escape') onClose();
      else if(e.key==='ArrowDown'){e.preventDefault();setFocus(f=>Math.min(results.length-1,f+1));}
      else if(e.key==='ArrowUp'){e.preventDefault();setFocus(f=>Math.max(0,f-1));}
      else if(e.key==='Enter'&&results[focus]) onPick(results[focus].symbol);
    };
    window.addEventListener('keydown',onKey);
    return ()=>window.removeEventListener('keydown',onKey);
  },[focus,results,onClose,onPick]);
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="search-modal" onClick={e=>e.stopPropagation()}>
        <div className="search-input">
          <Icon.Search/>
          <input ref={inputRef} value={q} onChange={e=>{setQ(e.target.value);setFocus(0);}} placeholder="Search tickers, e.g. AAPL, NVDA, PTT.BK…"/>
          <button className="btn" style={{padding:'4px 8px',fontSize:11}} onClick={onClose}>esc</button>
        </div>
        <div className="search-results">
          {results.length===0&&<div style={{padding:30,textAlign:'center',color:'var(--fg-2)',fontSize:13}}>No matches for "{q}"</div>}
          {results.map((s,i)=>(
            <div key={s.symbol} className={'search-row '+(i===focus?'focused':'')} onMouseEnter={()=>setFocus(i)} onClick={()=>onPick(s.symbol)}>
              <StockLogo symbol={s.symbol}/>
              <div className="info"><div className="t">{s.symbol} <span>{s.exchange}</span></div><div className="n">{s.name}</div></div>
              <div className="px">
                <div>{fmtPrice(s.price,s.currency)}</div>
                <div className={'dim '+(s.change>=0?'up':'down')} style={{fontSize:11,textAlign:'right'}}>{fmtPct(s.change_percent)}</div>
              </div>
            </div>
          ))}
        </div>
        <div className="search-footer">
          <span><kbd>↑↓</kbd> navigate</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
//  APP ROOT
// ═══════════════════════════════════════════════════════════
function App() {
  const [user, setUser] = React.useState(null);
  const [route, setRoute] = React.useState({ name: 'dashboard' });
  const [watchlist, setWatchlist] = React.useState(DEFAULT_WATCHLIST);
  const [searchOpen, setSearchOpen] = React.useState(false);
  const [addTickerOpen, setAddTickerOpen] = React.useState(false);
  const [setupOpen, setSetupOpen] = React.useState(false);
  const [stockDB, setStockDB] = React.useState({ ...MOCK_DB });
  const [apiLive, setApiLive] = React.useState(false);
  const [refreshing, setRefreshing] = React.useState(false);
  const [toast, setToast] = React.useState(null);

  // Restore session on mount
  React.useEffect(()=>{
    Auth.getSession().then(u=>{ if(u) setUser(u); });
  },[]);

  // ⌘K shortcut
  React.useEffect(()=>{
    const onKey=(e)=>{ if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(user)setSearchOpen(true);} };
    window.addEventListener('keydown',onKey);
    return ()=>window.removeEventListener('keydown',onKey);
  },[user]);

  // Fetch live data from Yahoo Finance
  const refreshData = React.useCallback(async ()=>{
    setRefreshing(true);
    try {
      const syms = [...new Set([...watchlist, ...Object.keys(MOCK_DB)])];
      const quotes = await YF.getQuotes(syms);
      if (quotes && quotes.length > 0) {
        const updated = { ...MOCK_DB };
        quotes.forEach(q => {
          const fallback = MOCK_DB[q.symbol] || {};
          updated[q.symbol] = YF.mapQuote(q, fallback);
        });
        setStockDB(updated);
        setApiLive(true);
        setToast({ msg: `Live data updated · ${quotes.length} symbols`, type: 'success' });
      }
    } catch (e) {
      setApiLive(false);
      setToast({ msg: 'Using mock data · Yahoo Finance proxy unavailable', type: 'info' });
    } finally {
      setRefreshing(false);
    }
  }, [watchlist]);

  // Auto-refresh on login and every 60s
  React.useEffect(()=>{
    if (!user) return;
    refreshData();
    const t = setInterval(refreshData, 60_000);
    return ()=>clearInterval(t);
  },[user]);

  const toggleStar = (sym) => setWatchlist(w=>w.includes(sym)?w.filter(s=>s!==sym):[...w,sym]);

  if (!user) {
    return (
      <>
        <LoginScreen onLogin={setUser} onOpenSetup={()=>setSetupOpen(true)}/>
        {setupOpen&&<SetupPanel onClose={()=>setSetupOpen(false)}/>}
      </>
    );
  }

  return (
    <>
      <div className="shell">
        <Sidebar route={route} setRoute={setRoute} onSignOut={async()=>{ await Auth.signOut(); setUser(null); setRoute({name:'dashboard'}); }} apiLive={apiLive}/>
        <TopBar user={user} onOpenSearch={()=>setSearchOpen(true)} apiLive={apiLive} onRefresh={refreshData} refreshing={refreshing}/>
        <main className="shell-main">
          {(route.name==='dashboard'||route.name==='watchlist')&&(
            <Dashboard
              watchlist={watchlist}
              stockDB={stockDB}
              showRibbon={true}
              showAIBrief={true}
              onOpen={sym=>setRoute({name:'detail',symbol:sym})}
              onRemove={sym=>setWatchlist(w=>w.filter(s=>s!==sym))}
              onAddTicker={()=>setAddTickerOpen(true)}
            />
          )}
          {route.name==='detail'&&(
            <StockDetail
              symbol={route.symbol}
              stockDB={stockDB}
              onBack={()=>setRoute({name:'dashboard'})}
              isStarred={watchlist.includes(route.symbol)}
              onToggleStar={()=>toggleStar(route.symbol)}
            />
          )}
        </main>
      </div>

      {searchOpen&&<SearchOverlay stockDB={stockDB} onClose={()=>setSearchOpen(false)} onPick={sym=>{setSearchOpen(false);setRoute({name:'detail',symbol:sym});}}/>}
      {addTickerOpen&&<AddTickerModal stockDB={stockDB} onClose={()=>setAddTickerOpen(false)} onAdd={sym=>setWatchlist(w=>w.includes(sym)?w:[...w,sym])}/>}
      {setupOpen&&<SetupPanel onClose={()=>setSetupOpen(false)}/>}
      {toast&&<Toast msg={toast.msg} type={toast.type} onClose={()=>setToast(null)}/>}
    </>
  );
}

// Spin animation for refresh button
const spinStyle = document.createElement('style');
spinStyle.textContent = '@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}';
document.head.appendChild(spinStyle);

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
